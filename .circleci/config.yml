version: 2.1

jobs:
  build-berberis:
    docker:
      - image: cimg/base:current

    resource_class: large

    environment:
      AOSP_TOP: /home/circleci/aosp
      DIGITALIS_MANIFEST: https://github.com/DigitalisX64/manifest.git
      DIGITALIS_REF: android-latest-release
      REPO_JOBS: "2"

    steps:
      - checkout

      - run:
          name: Prepare host
          command: |
            set -Eeuo pipefail
            sudo apt-get update -qq
            sudo apt-get install -y -qq \
              git-lfs rsync python3 curl unzip xz-utils \
              bc bison flex gperf build-essential ninja-build ccache
            git lfs install --skip-repo

            echo '=== RESOURCES ==='
            nproc
            free -h
            df -h /

      - run:
          name: Prepare repo
          command: |
            set -Eeuo pipefail
            mkdir -p "$HOME/bin" "$AOSP_TOP"
            curl -fsSL \
              https://storage.googleapis.com/git-repo-downloads/repo \
              -o "$HOME/bin/repo"
            chmod +x "$HOME/bin/repo"
            echo 'export PATH="$HOME/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"

            git config --global user.name "CircleCI Builder"
            git config --global user.email "circleci-builder@localhost"
            git config --global color.ui false
            git config --global url."https://github.com/".insteadOf "git@github.com:"
            git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
            git config --global url."https://github.com/".insteadOf "git://github.com/"

            rm -rf "$AOSP_TOP"
            mkdir -p "$AOSP_TOP"
            cd "$AOSP_TOP"

            repo init \
              -u "$DIGITALIS_MANIFEST" \
              -b "$DIGITALIS_REF" \
              --partial-clone \
              --clone-filter=blob:limit=5M \
              --no-use-superproject

            echo '=== REPO REMOTES ==='
            git -C .repo/manifests.git remote -v || true
            git -C .repo/manifests.git remote set-url origin https://github.com/DigitalisX64/manifest.git || true

            echo '=== VERIFY GIT IDENTITY ==='
            git config --global user.name
            git config --global user.email

      - run:
          name: Create lean PDK manifest
          command: |
            set -Eeuo pipefail
            source "$BASH_ENV"
            cd "$AOSP_TOP"

            # Keep the PDK dependency group, but remove host/platform content
            # that cannot be used by this Linux x86_64 build. This keeps the
            # build dependency graph broad enough for Soong/Berberis without
            # pulling obvious non-Linux or unrelated tooling.
            mkdir -p .repo/local_manifests

            cat > .repo/local_manifests/berberis-lean.xml <<'XML'
            <?xml version="1.0" encoding="UTF-8"?>
            <manifest>
              <!-- Non-Linux prebuilts are not needed by this Linux builder. -->
              <remove-project name="platform/prebuilts/clang/host/darwin-x86" optional="true"/>
              <remove-project name="platform/prebuilts/go/darwin-x86" optional="true"/>
              <remove-project name="platform/prebuilts/gradle-plugin" optional="true"/>
              <remove-project name="platform/prebuilts/ktlint" optional="true"/>
              <remove-project name="platform/external/chromium-webview" optional="true"/>
              <remove-project name="platform/external/chromium-crossbench" optional="true"/>
              <remove-project name="platform/external/chromium-trace" optional="true"/>
              <remove-project name="platform/external/chromium-web-tests" optional="true"/>
              <remove-project name="platform/prebuilts/jdk/jdk8" optional="true"/>
              <remove-project name="platform/prebuilts/jdk/jdk25" optional="true"/>
            </manifest>
            XML

            echo '=== LEAN MANIFEST ==='
            cat .repo/local_manifests/berberis-lean.xml

      - run:
          name: Sync lean PDK source
          command: |
            set -Eeuo pipefail
            source "$BASH_ENV"
            cd "$AOSP_TOP"

            repo sync \
              -g pdk \
              -c \
              -j"$REPO_JOBS" \
              --current-branch \
              --force-sync \
              --fail-fast \
              --no-tags \
              --no-clone-bundle \
              --optimized-fetch \
              --prune

            echo '=== AFTER SYNC ==='
            df -h /
            du -sh "$AOSP_TOP" 2>/dev/null || true

      - run:
          name: Inject ARM64 port
          command: |
            set -Eeuo pipefail
            cd "$AOSP_TOP"
            test -d "$CIRCLE_WORKING_DIRECTORY/heavy_optimizer/arm64"
            rm -rf "$AOSP_TOP/heavy_optimizer/arm64"
            mkdir -p "$AOSP_TOP/heavy_optimizer"
            cp -a "$CIRCLE_WORKING_DIRECTORY/heavy_optimizer/arm64" \
              "$AOSP_TOP/heavy_optimizer/arm64"

            if grep -q 'libberberis_heavy_optimizer_arm64' "$CIRCLE_WORKING_DIRECTORY/Android.bp"; then
              if ! grep -q 'libberberis_heavy_optimizer_arm64' "$AOSP_TOP/Android.bp"; then
                printf '\n// ARM64 Berberis port\n' >> "$AOSP_TOP/Android.bp"
                cat "$CIRCLE_WORKING_DIRECTORY/Android.bp" >> "$AOSP_TOP/Android.bp"
              fi
            fi

      - run:
          name: Build ARM64 Berberis
          command: |
            set -Eeuo pipefail
            cd "$AOSP_TOP"

            export SOONG_CONFIG_berberis_translation_arch=arm64_to_x86_64
            export TARGET_ARCH=x86_64
            export TARGET_2ND_ARCH=
            export OUT_DIR="$AOSP_TOP/out"
            export USE_CCACHE=1
            export CCACHE_DIR="$HOME/.cache/ccache"

            ccache -M 4G
            ccache -z

            # CircleCI reports 8 GiB RAM, so keep Soong parallelism at one.
            build/soong/soong_ui.bash --make-mode -j1 \
              libberberis_arm64 \
              libberberis_heavy_optimizer_arm64 \
              libberberis_heavy_optimizer_arm64_unit_tests

      - run:
          name: Verify output
          command: |
            set -Eeuo pipefail
            cd "$AOSP_TOP"

            SO="$(find "$OUT_DIR" -type f \
              -name 'libberberis_arm64.so' -print -quit)"

            test -n "$SO"
            file "$SO"
            readelf -h "$SO" | grep -q 'Machine:.*X86-64'

            echo '========================================'
            echo ' ARM64 -> x86_64 BUILD SUCCESS'
            echo '========================================'
            echo "Output: $SO"

            echo '=== FINAL RESOURCES ==='
            free -h
            df -h /
            ccache -s

      - store_artifacts:
          path: /home/circleci/aosp/out
          destination: berberis-out

workflows:
  build:
    jobs:
      - build-berberis
