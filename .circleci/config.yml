version: 2.1

jobs:
  probe:
    docker:
      - image: cimg/base:current

    steps:
      - checkout

      - run:
          name: Inspect CircleCI resources
          command: |
            set -eux

            echo '=== CPU ==='
            nproc

            echo '=== RAM ==='
            free -h

            echo '=== DISK ==='
            df -h

            echo '=== MOUNTS ==='
            mount | grep -E 'nvme|ramdisk|overlay|shm' || true

            echo '=== FILESYSTEM TARGETS ==='
            findmnt -T / || true
            findmnt -T /mnt/ramdisk || true
            findmnt -T /dev/shm || true
            findmnt /dev/nvme1n1 || true

            echo '=== DEVICE ==='
            lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINTS 2>/dev/null || true

            echo '=== WRITE TEST ==='
            for d in /tmp /mnt/ramdisk /dev/shm /home/circleci/project; do
              echo "Testing $d"
              if touch "$d/.circleci_write_test" 2>/dev/null; then
                rm -f "$d/.circleci_write_test"
                echo "WRITE_OK $d"
              else
                echo "WRITE_FAIL $d"
              fi
            done

            echo '=== SWAP ==='
            swapon --show 2>/dev/null || true

            echo '=== PROJECT ==='
            git rev-parse --show-toplevel
            git rev-parse HEAD

workflows:
  probe:
    jobs:
      - probe
