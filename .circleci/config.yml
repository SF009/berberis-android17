version: 2.1

jobs:
  build-berberis:
    machine:
      image: ubuntu-2404:current
    resource_class: xlarge

    environment:
      AOSP_TOP: /home/circleci/aosp
      DIGITALIS_MANIFEST: https://github.com/DigitalisX64/manifest.git
      DIGITALIS_REF: android-latest-release
      REPO_JOBS: "2"

    steps:
      - checkout

      - run:
          name: Install dependencies
          command: |
            set -eux

            sudo apt-get update

            sudo apt-get install -y \
              git-lfs \
              rsync \
              python3 \
              curl \
              unzip \
              xz-utils \
              bc \
              bison \
              flex \
              gperf \
              build-essential \
              ninja-build \
              ccache

            git lfs install --skip-repo

      - run:
          name: Install repo
          command: |
            set -eux

            mkdir -p "$HOME/bin"

            curl -fsSL \
              https://storage.googleapis.com/git-repo-downloads/repo \
              -o "$HOME/bin/repo"

            chmod +x "$HOME/bin/repo"

            echo 'export PATH="$HOME/bin:$PATH"' >> "$BASH_ENV"

      - run:
          name: Initialize Android source
          command: |
            set -eux
            source "$BASH_ENV"

            rm -rf "$AOSP_TOP"
            mkdir -p "$AOSP_TOP"

            cd "$AOSP_TOP"

            git config --global url."https://github.com/".insteadOf "git@github.com:"
            git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

            repo init \
              -u "$DIGITALIS_MANIFEST" \
              -b "$DIGITALIS_REF" \
              --partial-clone \
              --clone-filter=blob:limit=5M \
              --no-use-superproject

            # Force the manifest GitHub remote to HTTPS.
            git config --global \
              url."https://github.com/".insteadOf \
              "git@github.com:"

            git config --global \
              url."https://github.com/".insteadOf \
              "ssh://git@github.com/"

      - run:
          name: Sync Android source
          command: |
            set -eux
            source "$BASH_ENV"

            cd "$AOSP_TOP"

            repo sync \
              -g pdk \
              -c \
              -j"$REPO_JOBS" \
              --force-sync \
              --fail-fast \
              --no-tags \
              --no-clone-bundle \
              --optimized-fetch \
              --prune

      - run:
          name: Inject ARM64 Berberis port
          command: |
            set -eux

            rm -rf "$AOSP_TOP/heavy_optimizer/arm64"

            mkdir -p "$AOSP_TOP/heavy_optimizer"

            cp -a \
              "$CIRCLE_WORKING_DIRECTORY/heavy_optimizer/arm64" \
              "$AOSP_TOP/heavy_optimizer/arm64"

      - run:
          name: Build ARM64 translation
          command: |
            set -eux

            cd "$AOSP_TOP"

            export SOONG_CONFIG_berberis_translation_arch=arm64_to_x86_64
            export TARGET_ARCH=x86_64
            export OUT_DIR="$AOSP_TOP/out"

            build/soong/soong_ui.bash \
              --make-mode \
              -j2 \
              libberberis_arm64 \
              libberberis_heavy_optimizer_arm64 \
              libberberis_heavy_optimizer_arm64_unit_tests

      - run:
          name: Verify output
          command: |
            set -eux

            find "$AOSP_TOP/out" \
              -type f \
              -name 'libberberis_arm64.so' \
              -print

            SO="$(find "$AOSP_TOP/out" \
              -type f \
              -name 'libberberis_arm64.so' \
              -print -quit)"

            test -n "$SO"

            file "$SO"

            readelf -h "$SO" |
              grep -q 'Machine:.*X86-64'

            echo "BUILD SUCCESS"
            echo "$SO"

      - run:
          name: Show disk usage
          command: |
            df -h
            du -sh "$AOSP_TOP" || true

      - store_artifacts:
          path: /home/circleci/aosp/out
          destination: berberis-out

workflows:
  build:
    jobs:
      - build-berberis
