version: 2.1

jobs:
  probe:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Checkout repository over HTTPS
          command: |
            set -Eeuo pipefail

            rm -rf "$CIRCLE_WORKING_DIRECTORY"
            mkdir -p "$CIRCLE_WORKING_DIRECTORY"

            git clone \
              --depth 1 \
              --branch "$CIRCLE_BRANCH" \
              "https://github.com/SF009/berberis-android17.git" \
              "$CIRCLE_WORKING_DIRECTORY"
      - run:
          name: Report available CircleCI resources
          command: |
            set -eux
            echo '=== CPU ==='
            nproc
            echo '=== RAM ==='
            free -h
            echo '=== DISK ==='
            df -h
            echo '=== OS ==='
            uname -a
            echo '=== PROJECT ==='
            git rev-parse --show-toplevel

workflows:
  probe:
    jobs:
      - probe
