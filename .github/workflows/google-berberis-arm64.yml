name: Google-style ARM64 Berberis build

on:
  push:
    branches: [arm64-native-translation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      AOSP_TOP: ${{ github.workspace }}/aosp
      DIGITALIS_MANIFEST: https://github.com/DigitalisX64/manifest.git
      DIGITALIS_REF: android-latest-release
      REPO_JOBS: 4

    steps:
      - name: Checkout ARM64 Berberis sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install host dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-lfs rsync python3 curl unzip xz-utils bc bison flex build-essential
          git lfs install --skip-repo

      - name: Initialize Android checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$AOSP_TOP"
          mkdir -p "$AOSP_TOP" "$RUNNER_TEMP/bin"
          cd "$AOSP_TOP"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$RUNNER_TEMP/bin/repo"
          chmod +x "$RUNNER_TEMP/bin/repo"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          repo init \
            -u "$DIGITALIS_MANIFEST" \
            -b "$DIGITALIS_REF" \
            --partial-clone \
            --clone-filter=blob:limit=5M \
            --no-use-superproject

      - name: Sync Android checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$AOSP_TOP"
          # Match Google's model: let the Android manifest own the checkout.
          # Do not maintain a hand-written dependency list for Soong.
          repo sync \
            -c -j"$REPO_JOBS" \
            --force-sync \
            --fail-fast \
            --no-tags \
            --no-clone-bundle \
            --optimized-fetch \
            --prune

      - name: Overlay ARM64 Berberis port
        shell: bash
        run: |
          set -Eeuo pipefail

          # The repository is a Berberis source overlay. Its top-level directories
          # mirror frameworks/libs/binary_translation. Overlay them into the real
          # Google checkout so Soong sees the same project layout it expects.
          cd "$AOSP_TOP/frameworks/libs/binary_translation"

          for item in "$GITHUB_WORKSPACE"/*; do
            base="$(basename "$item")"
            case "$base" in
              .git|.github|README.md|LICENSE) continue ;;
            esac
            rm -rf "$base"
            cp -a "$item" "$base"
          done

          test -f Android.bp
          test -d heavy_optimizer/arm64
          test -f heavy_optimizer/arm64/Android.bp

      - name: Build using Google's documented flow
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$AOSP_TOP"

          source build/envsetup.sh
          lunch sdk_phone64_x86_64_riscv64-trunk_staging-eng

          # Google's documented Berberis build target.
          m berberis_all

          # Build all existing Berberis targets as recommended for development.
          mmm frameworks/libs/binary_translation

          # ARM64 guest -> x86_64 host target from this port.
          m libberberis_arm64 libberberis_heavy_optimizer_arm64

      - name: Run host tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$AOSP_TOP"

          test_bin="$(find out/host/linux-x86/nativetest64 -type f \( \
            -name 'berberis_arm64_host_tests' -o \
            -name 'berberis_host_tests' \
          \) -print -quit || true)"

          if [ -n "$test_bin" ]; then
            "$test_bin"
          else
            echo 'No Berberis host test binary found; build step already verified target compilation.'
          fi

      - name: Verify ARM64 output
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$AOSP_TOP"

          so="$(find out -type f -name 'libberberis_arm64.so' -print -quit || true)"
          test -n "$so"
          file "$so"
          readelf -h "$so" | grep -q 'Machine:.*X86-64'
          echo "ARM64 guest -> x86_64 host library: $so"

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: berberis-arm64-x86_64
          path: |
            aosp/out/**/libberberis_arm64.so
            aosp/out/**/libberberis_heavy_optimizer_arm64*
          if-no-files-found: error
