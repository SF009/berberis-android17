name: ARM64 Native Translation Build

on:
  push:
    branches: [arm64-native-translation]
  pull_request:
    branches: [arm64-native-translation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-native-translation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      AOSP_TOP: ${{ github.workspace }}/.build/aosp
      DIGITALIS_MANIFEST: https://github.com/DigitalisX64/manifest.git
      DIGITALIS_REF: android-latest-release
      CCACHE_KEY: berberis-ccache-Linux-arm64-v27
      REPO_JOBS: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ${{ env.CCACHE_KEY }}
          restore-keys: |
            berberis-ccache-Linux-arm64-v26
            berberis-ccache-Linux-arm64-v25
            berberis-ccache-Linux-arm64-v24

      - name: Build ARM64 native translation
        id: build
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$RUNNER_TEMP/arm64-build.log") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "BUILD_FAILED rc=$rc cmd=$BASH_COMMAND"; fi; exit "$rc"' EXIT
          set -x

          echo '=== HOST ==='
          date -u
          uname -a
          echo "CPU=$(nproc)"
          free -h
          df -h /

          echo '=== TOOLS ==='
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-lfs rsync python3 ccache curl unzip xz-utils bc bison flex build-essential
          git lfs install --skip-repo
          ccache --version

          echo '=== GIT HTTPS ==='
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

          echo '=== AOSP MANIFEST BOOTSTRAP ==='
          rm -rf "$AOSP_TOP"
          mkdir -p "$AOSP_TOP" "$RUNNER_TEMP/bin" "$HOME/.cache/ccache"
          cd "$AOSP_TOP"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$RUNNER_TEMP/bin/repo"
          chmod +x "$RUNNER_TEMP/bin/repo"
          export PATH="$RUNNER_TEMP/bin:$PATH"

          repo init \
            -u "$DIGITALIS_MANIFEST" \
            -b "$DIGITALIS_REF" \
            --partial-clone \
            --clone-filter=blob:limit=5M \
            --no-use-superproject

          echo '=== MINIMAL BUILD DEPENDENCIES ==='
          # Never use `repo sync` without paths or `repo sync -g pdk` here.
          # Both resolve to a very large fraction of the Android source tree.
          # The list below covers the build system, host toolchain, product files,
          # Android runtime libraries, and Berberis/Digitalis sources needed by
          # `m libberberis_arm64` after selecting the Digitalis product.
          repo sync \
            -c -j"$REPO_JOBS" \
            --force-sync \
            --fail-fast \
            --no-tags \
            --no-clone-bundle \
            --optimized-fetch \
            --prune \
            build/make \
            build/blueprint \
            build/pesto \
            build/release \
            build/soong \
            prebuilts/build-tools \
            prebuilts/clang/host/linux-x86 \
            prebuilts/go/linux-x86 \
            bionic \
            external/zlib \
            system/core \
            system/libbase \
            system/logging \
            frameworks/native \
            frameworks/libs/native_bridge_support \
            frameworks/libs/binary_translation \
            device/generic/common \
            device/generic/x86 \
            device/generic/x86_64 \
            device/generic/goldfish \
            hardware/google/gfxstream \
            digitalis

          echo '=== SOURCE CHECK ==='
          test -f build/envsetup.sh
          test -f build/soong/soong_ui.bash
          test -f frameworks/libs/binary_translation/Android.bp
          test -f frameworks/libs/binary_translation/enable_arm64_to_x86_64.mk
          test -f frameworks/libs/binary_translation/native_bridge/arm64/native_bridge.cc
          test -f frameworks/libs/binary_translation/decoder/arm64_test/decoder_test.cc
          test -f frameworks/libs/binary_translation/interpreter/arm64/interpreter-main.cc
          test -f frameworks/libs/binary_translation/lite_translator/arm64_to_x86_64/lite_translator.cc
          test -f frameworks/libs/binary_translation/code_gen_lib/arm64_to_x86_64/gen_wrapper.cc
          test -f digitalis/scripts/lunch-digitalis.sh
          test -f device/generic/goldfish/64bitonly/product/sdk_phone64_x86_64_digitalis.mk

          echo '=== ENVSETUP ==='
          set +u
          source build/envsetup.sh
          source digitalis/scripts/lunch-digitalis.sh
          set -u

          echo '=== TRANSLATION CONFIG ==='
          export SOONG_CONFIG_berberis_translation_arch=arm64_to_x86_64
          export USE_CCACHE=1
          export CCACHE_DIR="$HOME/.cache/ccache"
          ccache -M 4G
          ccache -z
          ccache -s

          echo '=== HOST BUILD ==='
          # Build only the ARM64 guest translator. Do not invoke bare `m`.
          m -j2 libberberis_arm64

          echo '=== VERIFY OUTPUT ==='
          out_dir="${OUT_DIR:-$AOSP_TOP/out}"
          so="$(find "$out_dir" -type f -name 'libberberis_arm64.so' -print -quit)"
          test -n "$so"
          file "$so"
          readelf -h "$so" | grep -q 'Machine:.*X86-64'
          ! nm -C "$so" 2>/dev/null | grep -Eiq 'riscv64|RISCV|RiscV'
          echo 'ARM64 native translation build: PASS'
          echo "Output: $so"

          echo '=== CCACHE ==='
          ccache -s

      - name: Save ccache
        if: steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ${{ env.CCACHE_KEY }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-build-logs
          path: ${{ runner.temp }}/arm64-build.log
          if-no-files-found: warn
