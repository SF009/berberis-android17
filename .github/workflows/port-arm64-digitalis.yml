name: ARM64 Native Translation Build

on:
  push:
    branches: [arm64-native-translation]
  pull_request:
    branches: [arm64-native-translation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-native-translation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      AOSP_TOP: ${{ github.workspace }}/aosp
      DIGITALIS_MANIFEST: https://github.com/DigitalisX64/manifest.git
      DIGITALIS_REF: android-latest-release
      CCACHE_KEY: berberis-ccache-Linux-arm64-v41
      REPO_JOBS: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git-lfs rsync python3 curl unzip xz-utils \
            bc bison flex gperf build-essential ccache
          git lfs install --skip-repo

      - name: Prepare repo
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$AOSP_TOP"
          mkdir -p "$AOSP_TOP" "$RUNNER_TEMP/bin" "$HOME/.cache/ccache"
          cd "$AOSP_TOP"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$RUNNER_TEMP/bin/repo"
          chmod +x "$RUNNER_TEMP/bin/repo"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/bin:$PATH"

          # Convert GitHub SSH URLs to HTTPS before repo creates project
          # remotes. This is required because the Digitalis manifest defines
          # GitHub projects through an SSH remote named "github".
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git://github.com/"

          repo init \
            -u "$DIGITALIS_MANIFEST" \
            -b "$DIGITALIS_REF" \
            --partial-clone \
            --clone-filter=blob:limit=5M \
            --no-use-superproject

          # Rewrite the manifest itself. Git URL rewriting alone is not
          # sufficient because repo materializes its own "github" remote.
          find .repo/manifests -type f \( -name '*.xml' -o -name '*.manifest' \) -print0 \
            | xargs -0r sed -i \
                -e 's#git@github.com:#https://github.com/#g' \
                -e 's#ssh://git@github.com/#https://github.com/#g'

          # Also rewrite any inherited/local manifest fragments.
          find .repo/local_manifests -type f \( -name '*.xml' -o -name '*.manifest' \) -print0 2>/dev/null \
            | xargs -0r sed -i \
                -e 's#git@github.com:#https://github.com/#g' \
                -e 's#ssh://git@github.com/#https://github.com/#g'

          echo '=== VERIFY NO GITHUB SSH URLS ==='
          if grep -R -nE 'git@github.com:|ssh://git@github.com/' .repo/manifests .repo/local_manifests 2>/dev/null; then
            echo 'ERROR: GitHub SSH URL remains in manifest'
            exit 1
          fi

      - name: Sync PDK source
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$AOSP_TOP"

          repo sync \
            -g pdk \
            -c -j"$REPO_JOBS" \
            --force-sync \
            --fail-fast \
            --no-tags \
            --no-clone-bundle \
            --optimized-fetch \
            --prune

      - name: Report source size
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$AOSP_TOP"
          echo '=== DISK AFTER SYNC ==='
          df -h /
          echo '=== AOSP SOURCE SIZE ==='
          du -sh . 2>/dev/null || true
          echo '=== PDK PROJECT COUNT ==='
          repo forall -g pdk -c 'echo "$REPO_PATH"' | wc -l

      - name: Verify build environment
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$AOSP_TOP"
          test -f build/envsetup.sh
          test -f build/make/core/envsetup.mk
          test -f build/soong/soong_ui.bash
          test -f build/soong/root.bp
          test -f build/soong/go.mod
          test -f bionic/Android.bp
          test -f frameworks/libs/binary_translation/Android.bp

      - name: Inject ARM64 port
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$AOSP_TOP"

          rm -rf "$AOSP_TOP/heavy_optimizer/arm64"
          mkdir -p "$AOSP_TOP/heavy_optimizer"
          cp -a "$GITHUB_WORKSPACE/heavy_optimizer/arm64" \
                "$AOSP_TOP/heavy_optimizer/arm64"

          # Add ARM64 module declarations only when they are not already
          # present. This avoids duplicate module definitions in Android.bp.
          if grep -q 'libberberis_heavy_optimizer_arm64' "$AOSP_TOP/Android.bp"; then
            echo 'ARM64 modules already present in AOSP Android.bp'
          elif grep -q 'libberberis_heavy_optimizer_arm64' "$GITHUB_WORKSPACE/Android.bp"; then
            cat "$GITHUB_WORKSPACE/Android.bp" >> "$AOSP_TOP/Android.bp"
          fi

      - name: Configure ccache
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/.cache/ccache"
          ccache -M 4G
          ccache -s

      - name: Build ARM64 native translation
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$RUNNER_TEMP/arm64-build.log") 2>&1
          cd "$AOSP_TOP"

          export SOONG_CONFIG_berberis_translation_arch=arm64_to_x86_64
          export TARGET_ARCH=x86_64
          export TARGET_2ND_ARCH=
          export OUT_DIR="$AOSP_TOP/out"
          export USE_CCACHE=1
          export CCACHE_DIR="$HOME/.cache/ccache"

          build/soong/soong_ui.bash --make-mode -j2 \
            libberberis_arm64 \
            libberberis_heavy_optimizer_arm64 \
            libberberis_heavy_optimizer_arm64_unit_tests

          echo '=== VERIFY OUTPUT ==='
          so="$(find "$OUT_DIR" -type f -name 'libberberis_arm64.so' -print -quit)"
          test -n "$so"
          file "$so"
          readelf -h "$so" | grep -q 'Machine:.*X86-64'
          echo 'ARM64 native translation build: PASS'
          echo "Output: $so"
          ccache -s

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ${{ env.CCACHE_KEY }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-build-logs
          path: ${{ runner.temp }}/arm64-build.log
          if-no-files-found: warn

      - name: Upload binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: berberis-arm64-x86_64
          path: |
            .build/aosp/out/**/libberberis_arm64.so
            .build/aosp/out/**/libberberis_heavy_optimizer_arm64*
          if-no-files-found: error
