name: ARM64 Native Translation Build

on:
  push:
    branches: [arm64-native-translation]
  pull_request:
    branches: [arm64-native-translation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      AOSP_TOP: ${{ github.workspace }}/aosp
      DIGITALIS_MANIFEST: https://github.com/DigitalisX64/manifest.git
      DIGITALIS_REF: android-latest-release
      CCACHE_KEY: berberis-ccache-Linux-arm64-v41
      REPO_JOBS: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore ccache
        id: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ env.CCACHE_KEY }}
          restore-keys: |
            berberis-ccache-Linux-arm64-v40
            berberis-ccache-Linux-arm64-v39
            berberis-ccache-Linux-arm64-v38

      - name: Install build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git-lfs rsync python3 curl unzip xz-utils \
            bc bison flex gperf build-essential
          git lfs install --skip-repo

      - name: Prepare repo
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$AOSP_TOP" "$RUNNER_TEMP/bin"
          cd "$AOSP_TOP"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$RUNNER_TEMP/bin/repo"
          chmod +x "$RUNNER_TEMP/bin/repo"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/bin:$PATH"

          repo init \
            -u "$DIGITALIS_MANIFEST" \
            -b "$DIGITALIS_REF" \
            --partial-clone \
            --clone-filter=blob:limit=5M \
            --no-use-superproject

          # repo creates its manifest remote from the manifest repository.
          # The manifest uses a GitHub SSH remote, which GitHub-hosted runners
          # cannot authenticate with. Rewrite the manifest repository remote
          # itself to HTTPS before any project sync happens.
          MANIFEST_GIT="$AOSP_TOP/.repo/manifests.git"
          if [ -d "$MANIFEST_GIT" ]; then
            while read -r name url; do
              case "$url" in
                git@github.com:*|ssh://git@github.com/*|git://github.com/*)
                  https_url="https://github.com/${url#git@github.com:}"
                  https_url="https://github.com/${https_url#ssh://git@github.com/}"
                  https_url="https://github.com/${https_url#git://github.com/}"
                  git -C "$MANIFEST_GIT" remote set-url "$name" "$https_url"
                  ;;
              esac
            done < <(git -C "$MANIFEST_GIT" remote -v | awk '!seen[$1 FS $2]++ {print $1, $2}')
          fi

          # Defensive Git URL rewrites for project remotes.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git://github.com/"

          echo '=== MANIFEST REMOTES ==='
          git -C "$MANIFEST_GIT" remote -v || true

      - name: Inspect manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$AOSP_TOP"
          MANIFEST_FILE="$(find .repo/manifests -type f -name '*.xml' -print -quit)"
          test -n "$MANIFEST_FILE"

          echo "Manifest: $MANIFEST_FILE"
          python3 - "$MANIFEST_FILE" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          paths = []
          for p in root.findall('.//project'):
              groups = {x.strip() for x in p.get('groups', '').split(',') if x.strip()}
              if 'pdk' in groups and p.get('path'):
                  paths.append(p.get('path'))
          paths = sorted(set(paths))
          print(f'PDK projects: {len(paths)}')
          for path in paths:
              print(path)
          PY

          echo '=== MANIFEST SIZE ==='
          wc -c "$MANIFEST_FILE"
          echo '=== DISK BEFORE SYNC ==='
          df -h /

      - name: Sync PDK source
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$AOSP_TOP"

          # Sync the manifest-selected PDK dependency set. No hand-written
          # dependency list and no SSH authentication required.
          repo sync \
            -g pdk \
            -c -j"$REPO_JOBS" \
            --force-sync \
            --fail-fast \
            --no-tags \
            --no-clone-bundle \
            --optimized-fetch \
            --prune

      - name: Report synced size
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$AOSP_TOP"
          echo '=== DISK AFTER PDK SYNC ==='
          df -h /
          echo '=== AOSP SOURCE SIZE ==='
          du -sh .

      - name: Verify build environment
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$AOSP_TOP"
          test -f build/envsetup.sh
          test -f build/make/core/envsetup.mk
          test -f build/soong/soong_ui.bash
          test -f build/soong/root.bp
          test -f build/soong/go.mod
          test -f bionic/Android.bp
          test -f frameworks/libs/binary_translation/Android.bp

      - name: Inject ARM64 port
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$AOSP_TOP"

          rm -rf heavy_optimizer/arm64
          mkdir -p heavy_optimizer
          cp -a "$GITHUB_WORKSPACE/heavy_optimizer/arm64" heavy_optimizer/arm64

          if grep -q 'libberberis_heavy_optimizer_arm64' "$GITHUB_WORKSPACE/Android.bp"; then
            cat "$GITHUB_WORKSPACE/Android.bp" >> Android.bp
          fi

      - name: Build ARM64 native translation
        id: build
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$RUNNER_TEMP/arm64-build.log") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "BUILD_FAILED rc=$rc cmd=$BASH_COMMAND"; fi; exit "$rc"' EXIT

          cd "$AOSP_TOP"

          export SOONG_CONFIG_berberis_translation_arch=arm64_to_x86_64
          export TARGET_ARCH=x86_64
          export TARGET_2ND_ARCH=
          export OUT_DIR="$AOSP_TOP/out"
          export USE_CCACHE=1
          export CCACHE_DIR="$HOME/.cache/ccache"

          ccache -M 4G
          ccache -z

          build/soong/soong_ui.bash --make-mode -j2 \
            libberberis_arm64 \
            libberberis_heavy_optimizer_arm64 \
            libberberis_heavy_optimizer_arm64_unit_tests

          echo '=== VERIFY OUTPUT ==='
          so="$(find "$OUT_DIR" -type f -name 'libberberis_arm64.so' -print -quit)"
          test -n "$so"
          file "$so"
          readelf -h "$so" | grep -q 'Machine:.*X86-64'
          echo 'ARM64 native translation build: PASS'
          echo "Output: $so"

      - name: Save ccache
        if: always() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ${{ env.CCACHE_KEY }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-build-logs
          path: ${{ runner.temp }}/arm64-build.log
          if-no-files-found: warn

      - name: Upload binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: berberis-arm64-x86_64
          path: |
            .build/aosp/out/**/libberberis_arm64.so
            .build/aosp/out/**/libberberis_heavy_optimizer_arm64*
          if-no-files-found: error
