name: ARM64 Native Translation Build

on:
  push:
    branches: [arm64-native-translation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Do not require a custom `aosp17` label; a persistent Linux x86_64
    # self-hosted runner with an existing AOSP checkout is sufficient.
    runs-on: [self-hosted, linux, x86_64]
    timeout-minutes: 180

    steps:
      - name: Checkout ARM64 native translation
        uses: actions/checkout@v4
        with:
          ref: arm64-native-translation
          fetch-depth: 1

      - name: Prepare cached ARM64 source
        shell: bash
        env:
          DIGITALIS_REPO: https://github.com/DigitalisX64/platform_frameworks_libs_binary_translation.git
          DIGITALIS_REF: 6f199667f039ff5f33c1d80fe52b59300ec1b663
        run: |
          set -euo pipefail

          # AOSP_TOP should already be exported by the persistent self-hosted
          # runner. This avoids passing a path as a workflow input on every run.
          : "${AOSP_TOP:?AOSP_TOP must be configured in the runner environment}"
          test -f "$AOSP_TOP/build/envsetup.sh"
          test -d "$AOSP_TOP/.repo"

          manifest_rev="$(git -C "$AOSP_TOP/.repo/manifests" show HEAD:default.xml | sed -n 's/.*default revision="\([^"]*\)".*/\1/p' | head -n1)"
          test "$manifest_rev" = android17-release

          # Persistent local mirror: first run downloads it; later runs only
          # perform a tiny fetch/checkout of the pinned revision.
          cache="${DIGITALIS_CACHE:-${RUNNER_TOOL_CACHE:-$HOME/.cache}/berberis/digitalis}"
          mkdir -p "$(dirname "$cache")"
          if [[ ! -d "$cache/.git" ]]; then
            rm -rf "$cache"
            git clone --filter=blob:none --no-checkout "$DIGITALIS_REPO" "$cache"
          fi
          git -C "$cache" fetch --depth=1 origin "$DIGITALIS_REF"
          git -C "$cache" checkout --detach --force "$DIGITALIS_REF"

          imported="$RUNNER_TEMP/berberis-arm64"
          rm -rf "$imported"
          mkdir -p "$imported"
          rsync -a --delete --exclude='.git/' "$cache/" "$imported/"

          python3 tools/materialize_arm64_build.py "$imported"

          test -f "$imported/Android.bp"
          test -f "$imported/enable_arm64_to_x86_64.mk"
          test -f "$imported/berberis_config.mk"
          test -f "$imported/native_bridge/arm64/native_bridge.cc"
          test -f "$imported/decoder/arm64_test/decoder_test.cc"
          test -f "$imported/interpreter/arm64/interpreter-main.cc"
          test -f "$imported/lite_translator/arm64_to_x86_64/lite_translator.cc"
          test -f "$imported/code_gen_lib/arm64_to_x86_64/gen_wrapper.cc"

          dst="$AOSP_TOP/frameworks/libs/binary_translation"
          rm -rf "$dst"
          mkdir -p "$(dirname "$dst")"
          rsync -a --delete --exclude='.git/' "$imported/" "$dst/"

      - name: Build once
        shell: bash
        run: |
          set -euo pipefail
          : "${AOSP_TOP:?AOSP_TOP must be configured in the runner environment}"
          : "${TARGET_PRODUCT:=sdk_phone64_x86_64}"
          : "${TARGET_BUILD_VARIANT:=eng}"

          cd "$AOSP_TOP"
          source build/envsetup.sh
          lunch "${TARGET_PRODUCT}-${TARGET_BUILD_VARIANT}"

          export SOONG_CONFIG_berberis_translation_arch=arm64_to_x86_64
          export NINJA_STATUS='[%f/%t %e] '

          # The only compiler/build invocation in this workflow.
          m -j"$(nproc)" \
            libberberis_arm64 \
            libberberis_decoder_arm64_unit_tests \
            libberberis_interpreter_arm64_unit_tests \
            libberberis_lite_translator_arm64_to_x86_64_unit_tests

          out_dir="${OUT_DIR:-$AOSP_TOP/out}"
          so="$(find "$out_dir" -type f -name 'libberberis_arm64.so' -print -quit)"
          test -n "$so"

          file "$so"
          readelf -h "$so" | grep -q 'Machine:.*Advanced Micro Devices X86-64'
          ! nm -C "$so" 2>/dev/null | grep -Eiq 'riscv64|RISCV|RiscV'

          echo "ARM64 native translation build: PASS"
          echo "Output: $so"
