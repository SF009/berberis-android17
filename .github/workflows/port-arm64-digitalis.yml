name: Port Digitalis ARM64 backend

on:
  push:
    branches: [arm64-to-x86_64]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port:
    if: ${{ !contains(github.event.head_commit.message || '', '[digitalis-arm64-port]') }}
    runs-on: ubuntu-24.04
    env:
      DIGITALIS_REPO: https://github.com/DigitalisX64/platform_frameworks_libs_binary_translation.git
      DIGITALIS_REF: android-latest-release
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arm64-to-x86_64
          persist-credentials: true

      - name: Merge Digitalis history
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none "$DIGITALIS_REPO" "$RUNNER_TEMP/digitalis"
          git -C "$RUNNER_TEMP/digitalis" fetch origin "$DIGITALIS_REF"
          git -C "$RUNNER_TEMP/digitalis" checkout --detach FETCH_HEAD

          # Prefer a real 3-way merge. Both projects originate from the same
          # AOSP history, so Git can recognize the large Android17 cpu_emulation
          # rename and preserve the existing RISC-V64 implementation.
          git remote add digitalis "$DIGITALIS_REPO"
          git fetch digitalis "$DIGITALIS_REF"
          if git merge-base HEAD "digitalis/$DIGITALIS_REF" >/tmp/merge-base; then
            BASE=$(cat /tmp/merge-base)
            echo "Common ancestor: $BASE"
          else
            echo 'No common ancestor found; refusing unsafe tree replacement.' >&2
            exit 1
          fi

          set +e
          git merge --no-commit --no-ff "digitalis/$DIGITALIS_REF"
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            echo 'Merge conflicts detected. Resolving ARM64-specific paths from Digitalis.'
            git status --short

            # ARM64-only trees should always come from Digitalis. RISC-V-only
            # trees remain from Android17. Shared files are left for explicit
            # merge resolution below.
            for p in \
              cpu_emulation/backend/arm64_to_x86_64 \
              cpu_emulation/code_gen_lib/arm64_to_x86_64 \
              cpu_emulation/decoder/arm64 \
              cpu_emulation/heavy_optimizer/arm64 \
              cpu_emulation/interpreter/arm64 \
              cpu_emulation/lite_translator/arm64_to_x86_64 \
              cpu_emulation/insn_tests/arm64 \
              cpu_emulation/intrinsics/arm64_to_all \
              guest_os_primitives/arm64 \
              guest_state/arm64 \
              kernel_api/arm64 \
              runtime/arm64 \
              guest_loader/arm64 \
              native_bridge/arm64; do
              git checkout --theirs -- "$p" 2>/dev/null || true
            done

            # Preserve Android17's RISC-V implementation on known RISC-V paths.
            for p in \
              cpu_emulation/backend/riscv64_to_x86_64 \
              cpu_emulation/code_gen_lib/riscv64_to_all \
              cpu_emulation/decoder/riscv64 \
              cpu_emulation/heavy_optimizer/riscv64 \
              cpu_emulation/interpreter/riscv64 \
              cpu_emulation/lite_translator/riscv64_to_x86_64 \
              guest_os_primitives/riscv64 \
              guest_state/riscv64 \
              kernel_api/riscv64 \
              runtime/riscv64 \
              guest_loader/riscv64 \
              native_bridge/riscv64; do
              git checkout --ours -- "$p" 2>/dev/null || true
            done

            # For the integration files, take Digitalis' ARM64 wiring and then
            # retain Android17's RISC-V sections with an explicit post-merge
            # check. These files are small enough to inspect deterministically.
            for p in Android.bp berberis_config.mk; do
              if git diff --name-only --diff-filter=U | grep -qx "$p"; then
                git checkout --theirs -- "$p"
              fi
            done

            # Package-level integration files have arch-specific additions and
            # are safer to take from Digitalis after the tree merge.
            for p in \
              program_runner/Android.bp \
              prebuilt/Android.bp \
              prebuilt/system/etc/init/berberis.rc; do
              if git diff --name-only --diff-filter=U | grep -qx "$p"; then
                git checkout --theirs -- "$p"
              fi
            done

            # Resolve remaining conflicts only when Git can prove one side is
            # unchanged from the merge base.
            for p in $(git diff --name-only --diff-filter=U); do
              ours=$(git rev-parse ":2:$p" 2>/dev/null || true)
              theirs=$(git rev-parse ":3:$p" 2>/dev/null || true)
              base=$(git rev-parse ":1:$p" 2>/dev/null || true)
              if [ -n "$base" ] && [ -n "$ours" ] && [ -n "$theirs" ]; then
                if git diff --quiet "$base" "$ours"; then
                  git checkout --theirs -- "$p"
                elif git diff --quiet "$base" "$theirs"; then
                  git checkout --ours -- "$p"
                else
                  echo "Unresolved semantic conflict: $p" >&2
                  exit 2
                fi
              fi
            done
          fi

          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit after merge.'
            exit 0
          fi

          # Keep the merge as a single auditable integration commit.
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m 'Digitalis: merge complete ARM64 guest to x86_64 host support [digitalis-arm64-port]'
          else
            git commit -m 'Digitalis: import ARM64 guest to x86_64 host support [digitalis-arm64-port]'
          fi
          git push origin HEAD:arm64-to-x86_64

      - name: Validate required ARM64 components
        shell: bash
        run: |
          set -euo pipefail
          required=(
            cpu_emulation/decoder/arm64
            cpu_emulation/interpreter/arm64
            cpu_emulation/lite_translator/arm64_to_x86_64
            cpu_emulation/backend/arm64_to_x86_64
            cpu_emulation/code_gen_lib/arm64_to_x86_64
            guest_abi/arm64
            guest_loader/arm64
            guest_os_primitives/arm64
            guest_state/arm64
            kernel_api/arm64
            runtime/arm64
            native_bridge/arm64
          )
          for p in "${required[@]}"; do
            test -d "$p" || { echo "missing: $p" >&2; exit 1; }
          done
          grep -Rqs 'arm64_to_x86_64' Android.bp berberis_config.mk enable_arm64_to_x86_64.mk 2>/dev/null || true
          git diff --check
