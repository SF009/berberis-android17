name: ARM64 Native Translation Build

on:
  push:
    branches: [arm64-native-translation]
  pull_request:
    branches: [arm64-native-translation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-native-translation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      AOSP_TOP: ${{ github.workspace }}/.build/aosp
      DIGITALIS_MANIFEST: https://github.com/DigitalisX64/manifest.git
      DIGITALIS_REF: android-latest-release
      CCACHE_KEY: berberis-ccache-Linux-arm64-v31
      REPO_JOBS: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ${{ env.CCACHE_KEY }}
          restore-keys: |
            berberis-ccache-Linux-arm64-v30
            berberis-ccache-Linux-arm64-v29
            berberis-ccache-Linux-arm64-v28

      - name: Build ARM64 native translation
        id: build
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$RUNNER_TEMP/arm64-build.log") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "BUILD_FAILED rc=$rc cmd=$BASH_COMMAND"; fi; exit "$rc"' EXIT
          set -x

          echo '=== HOST ==='
          date -u
          uname -a
          echo "CPU=$(nproc)"
          free -h
          df -h /

          echo '=== TOOLS ==='
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-lfs rsync python3 ccache curl unzip xz-utils bc bison flex build-essential
          git lfs install --skip-repo
          ccache --version

          echo '=== GIT HTTPS ==='
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

          echo '=== AOSP MANIFEST BOOTSTRAP ==='
          rm -rf "$AOSP_TOP"
          mkdir -p "$AOSP_TOP" "$RUNNER_TEMP/bin" "$HOME/.cache/ccache"
          cd "$AOSP_TOP"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$RUNNER_TEMP/bin/repo"
          chmod +x "$RUNNER_TEMP/bin/repo"
          export PATH="$RUNNER_TEMP/bin:$PATH"

          repo init \
            -u "$DIGITALIS_MANIFEST" \
            -b "$DIGITALIS_REF" \
            --partial-clone \
            --clone-filter=blob:limit=5M \
            --no-use-superproject

          echo '=== FIXED ARM64 HOST DEPENDENCY SET ==='
          # Derived from the actual host dependency graph of libberberis_arm64
          # and the Android/Soong build files used by that graph.  This is one
          # fixed sync: no dependency resolver loop and no repo sync -g pdk.
          # Product/image-only projects are intentionally excluded.
          repo sync \
            -c -j"$REPO_JOBS" \
            --force-sync \
            --fail-fast \
            --no-tags \
            --no-clone-bundle \
            --optimized-fetch \
            --prune \
            build/make \
            build/blueprint \
            build/soong \
            prebuilts/build-tools \
            prebuilts/clang/host/linux-x86 \
            prebuilts/go/linux-x86 \
            bionic \
            external/fmtlib \
            external/go-cmp \
            external/golang-protobuf \
            external/protobuf \
            external/starlark-go \
            external/zlib \
            system/libbase \
            system/logging \
            frameworks/libs/native_bridge_support \
            frameworks/libs/binary_translation

          echo '=== SOURCE CHECK ==='
          test -f build/make/core/envsetup.mk
          test -f build/soong/soong_ui.bash
          test -f build/soong/go.mod
          test -d external/fmtlib
          test -d external/go-cmp
          test -d external/golang-protobuf
          test -d external/protobuf
          test -d external/starlark-go
          test -d external/zlib
          test -f system/libbase/Android.bp
          test -f frameworks/libs/native_bridge_support/Android.bp
          test -f frameworks/libs/binary_translation/Android.bp
          test -f frameworks/libs/binary_translation/proxy_loader/Android.bp

          echo '=== HOST TRANSLATION CONFIG ==='
          export SOONG_CONFIG_berberis_translation_arch=arm64_to_x86_64
          export TARGET_ARCH=x86_64
          export TARGET_2ND_ARCH=
          export OUT_DIR="$AOSP_TOP/out"
          export USE_CCACHE=1
          export CCACHE_DIR="$HOME/.cache/ccache"
          ccache -M 4G
          ccache -z
          ccache -s

          echo '=== HOST BUILD: ONLY libberberis_arm64 ==='
          build/soong/soong_ui.bash --make-mode -j2 libberberis_arm64

          echo '=== VERIFY OUTPUT ==='
          so="$(find "$OUT_DIR" -type f -name 'libberberis_arm64.so' -print -quit)"
          test -n "$so"
          file "$so"
          readelf -h "$so" | grep -q 'Machine:.*X86-64'
          ! nm -C "$so" 2>/dev/null | grep -Eiq 'riscv64|RISCV|RiscV'
          echo 'ARM64 native translation build: PASS'
          echo "Output: $so"

          echo '=== CCACHE ==='
          ccache -s

      - name: Save ccache
        if: steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ${{ env.CCACHE_KEY }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-build-logs
          path: ${{ runner.temp }}/arm64-build.log
          if-no-files-found: warn
