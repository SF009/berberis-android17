name: ARM64 Native Translation Build

on:
  push:
    branches: [arm64-native-translation]
  pull_request:
    branches: [arm64-native-translation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-native-translation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      AOSP_TOP: ${{ github.workspace }}/.build/aosp
      DIGITALIS_MANIFEST: https://github.com/DigitalisX64/manifest.git
      DIGITALIS_REF: android-latest-release
      CCACHE_KEY: berberis-ccache-Linux-arm64-v40
      REPO_JOBS: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ${{ env.CCACHE_KEY }}
          restore-keys: |
            berberis-ccache-Linux-arm64-v39
            berberis-ccache-Linux-arm64-v38

      - name: Prepare repo
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$AOSP_TOP"
          mkdir -p "$AOSP_TOP" "$RUNNER_TEMP/bin"
          cd "$AOSP_TOP"

          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$RUNNER_TEMP/bin/repo"
          chmod +x "$RUNNER_TEMP/bin/repo"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

          repo init \
            -u "$DIGITALIS_MANIFEST" \
            -b "$DIGITALIS_REF" \
            --partial-clone \
            --clone-filter=blob:limit=5M \
            --no-use-superproject

      - name: Sync manifest-defined build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$AOSP_TOP"

          # These paths are present in Digitalis android-latest-release.
          # Do not use -g pdk: that would fetch the whole PDK source set.
          repo sync \
            -c -j"$REPO_JOBS" \
            --force-sync \
            --fail-fast \
            --no-tags \
            --no-clone-bundle \
            --optimized-fetch \
            --prune \
            build/make \
            build/blueprint \
            build/pesto \
            build/release \
            build/soong \
            bionic \
            external/fmtlib \
            external/go-cmp \
            external/golang-protobuf \
            external/pogreb \
            external/protobuf \
            external/starlark-go \
            external/zlib \
            packages/modules/common \
            prebuilts/build-tools \
            prebuilts/remoteexecution-client \
            prebuilts/clang/host/linux-x86 \
            prebuilts/go/linux-x86 \
            prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8 \
            system/libbase \
            system/logging \
            frameworks/libs/native_bridge_support \
            frameworks/libs/binary_translation

      - name: Inject ARM64 heavy optimizer without modifying Soong root
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$AOSP_TOP"

          rm -rf heavy_optimizer/arm64
          mkdir -p heavy_optimizer
          cp -a "$GITHUB_WORKSPACE/heavy_optimizer/arm64" heavy_optimizer/arm64

          # The repo-created Android.bp is a symlink to build/soong/root.bp.
          # Never append the project Android.bp to that symlink. Instead use a
          # dedicated namespace file that only contains the ARM64 optimizer.
          cat > heavy_optimizer/Android.bp <<'EOF'
subdirs = ["arm64"]
EOF

          # Expose the top-level Berberis definitions from this repository
          # without mutating build/soong/root.bp.
          cp "$GITHUB_WORKSPACE/Android.bp" heavy_optimizer/berberis_root.bp

      - name: Verify environment
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$AOSP_TOP"

          test -x build/soong/soong_ui.bash
          test -f build/soong/root.bp
          test -f build/soong/go.mod
          test -f bionic/Android.bp
          test -f frameworks/libs/binary_translation/Android.bp
          test -f heavy_optimizer/arm64/Android.bp

      - name: Build ARM64 native translation
        id: build
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$RUNNER_TEMP/arm64-build.log") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "BUILD_FAILED rc=$rc cmd=$BASH_COMMAND"; fi; exit "$rc"' EXIT

          cd "$AOSP_TOP"
          export SOONG_CONFIG_berberis_translation_arch=arm64_to_x86_64
          export TARGET_ARCH=x86_64
          export TARGET_2ND_ARCH=
          export OUT_DIR="$AOSP_TOP/out"
          export USE_CCACHE=1
          export CCACHE_DIR="$HOME/.cache/ccache"

          ccache -M 4G
          ccache -z

          echo '=== BUILD ==='
          build/soong/soong_ui.bash --make-mode -j2 \
            libberberis_heavy_optimizer_arm64 \
            libberberis_arm64 \
            libberberis_heavy_optimizer_arm64_unit_tests

          echo '=== VERIFY OUTPUT ==='
          so="$(find "$OUT_DIR" -type f -name 'libberberis_arm64.so' -print -quit)"
          test -n "$so"
          file "$so"
          readelf -h "$so" | grep -q 'Machine:.*X86-64'
          echo 'ARM64 native translation build: PASS'
          echo "Output: $so"
          ccache -s

      - name: Save ccache
        if: always() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ${{ env.CCACHE_KEY }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-build-logs
          path: ${{ runner.temp }}/arm64-build.log
          if-no-files-found: warn

      - name: Upload binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: berberis-arm64-x86_64
          path: |
            .build/aosp/out/**/libberberis_arm64.so
            .build/aosp/out/**/libberberis_heavy_optimizer_arm64*
          if-no-files-found: error
