name: ARM64 Native Translation Build

on:
  push:
    branches: [arm64-native-translation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      AOSP_TOP: ${{ runner.temp }}/digitalis
      DIGITALIS_MANIFEST: https://github.com/DigitalisX64/manifest.git
      DIGITALIS_REF: android-latest-release
      TARGET_PRODUCT: sdk_phone64_x86_64_digitalis-trunk_staging
      TARGET_BUILD_VARIANT: userdebug

    steps:
      - name: Checkout ARM64 native translation
        uses: actions/checkout@v4
        with:
          ref: arm64-native-translation
          fetch-depth: 1

      - name: Sync minimal Digitalis build tree
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-lfs rsync python3
          git lfs install --skip-repo

          rm -rf "$AOSP_TOP"
          mkdir -p "$AOSP_TOP"
          cd "$AOSP_TOP"

          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          export PATH="$HOME/bin:$PATH"

          repo init \
            -u "$DIGITALIS_MANIFEST" \
            -b "$DIGITALIS_REF" \
            --partial-clone \
            --clone-filter=blob:limit=5M \
            --no-use-superproject

          # Only the normal manifest projects and PDK/build dependencies.
          # This deliberately avoids the full Android manifest.
          repo sync \
            -c \
            -g default,pdk \
            -j4 \
            --no-tags \
            --no-clone-bundle \
            --optimized-fetch \
            --prune

          test -f build/envsetup.sh
          test -d build/soong
          test -d prebuilts/clang
          test -d frameworks/libs/binary_translation

      - name: Overlay ARM64 branch into Digitalis tree
        shell: bash
        run: |
          set -euo pipefail
          dst="$AOSP_TOP/frameworks/libs/binary_translation"
          src="$GITHUB_WORKSPACE"

          # Keep the Android build tree supplied by the Digitalis manifest, but
          # replace only binary_translation with this branch.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            "$src/" "$dst/"

          test -f "$dst/Android.bp"
          test -f "$dst/enable_arm64_to_x86_64.mk"
          test -f "$dst/berberis_config.mk"
          test -f "$dst/native_bridge/arm64/native_bridge.cc"
          test -f "$dst/decoder/arm64_test/decoder_test.cc"
          test -f "$dst/interpreter/arm64/interpreter-main.cc"
          test -f "$dst/lite_translator/arm64_to_x86_64/lite_translator.cc"
          test -f "$dst/code_gen_lib/arm64_to_x86_64/gen_wrapper.cc"

      - name: Build once
        shell: bash
        run: |
          set -euo pipefail
          cd "$AOSP_TOP"
          source build/envsetup.sh
          lunch "${TARGET_PRODUCT}-${TARGET_BUILD_VARIANT}"
          export SOONG_CONFIG_berberis_translation_arch=arm64_to_x86_64
          export NINJA_STATUS='[%f/%t %e] '

          # The only build invocation.
          m -j4 \
            libberberis_arm64 \
            libberberis_decoder_arm64_unit_tests \
            libberberis_interpreter_arm64_unit_tests \
            libberberis_lite_translator_arm64_to_x86_64_unit_tests

          out_dir="${OUT_DIR:-$AOSP_TOP/out}"
          so="$(find "$out_dir" -type f -name 'libberberis_arm64.so' -print -quit)"
          test -n "$so"

          file "$so"
          readelf -h "$so" | grep -q 'Machine:.*Advanced Micro Devices X86-64'
          ! nm -C "$so" 2>/dev/null | grep -Eiq 'riscv64|RISCV|RiscV'

          echo "ARM64 native translation build: PASS"
          echo "Output: $so"
