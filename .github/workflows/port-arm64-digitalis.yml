name: ARM64 Native Translation Build

on:
  push:
    branches:
      - arm64-native-translation
  pull_request:
    branches:
      - arm64-native-translation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-native-translation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      AOSP_TOP: ${{ github.workspace }}/.build/aosp
      DIGITALIS_MANIFEST: https://github.com/DigitalisX64/manifest.git
      DIGITALIS_REF: android-latest-release
      TARGET_PRODUCT: sdk_phone64_x86_64_digitalis-trunk_staging
      TARGET_BUILD_VARIANT: userdebug

    steps:
      - name: Checkout port configuration
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build pinned Digitalis ARM64 translation
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$RUNNER_TEMP/arm64-build.log") 2>&1
          trap 'rc=$?; echo "BUILD_FAILED rc=$rc line=$LINENO cmd=$BASH_COMMAND"; exit $rc' EXIT
          set -x

          echo '=== BUILD START ==='
          date -u
          uname -a
          nproc
          df -h /

          echo '=== INSTALL TOOLS ==='
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-lfs rsync python3
          git lfs install --skip-repo

          echo '=== CONFIGURE GIT HTTPS ==='
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

          echo '=== INIT AOSP TREE ==='
          rm -rf "$AOSP_TOP"
          mkdir -p "$AOSP_TOP" "$RUNNER_TEMP/bin"
          cd "$AOSP_TOP"

          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$RUNNER_TEMP/bin/repo"
          chmod +x "$RUNNER_TEMP/bin/repo"
          export PATH="$RUNNER_TEMP/bin:$PATH"

          repo init \
            -u "$DIGITALIS_MANIFEST" \
            -b "$DIGITALIS_REF" \
            --partial-clone \
            --clone-filter=blob:limit=5M \
            --no-use-superproject

          echo '=== SYNC DIGITALIS ==='
          repo sync \
            -c \
            -g default,pdk \
            -j4 \
            --no-tags \
            --no-clone-bundle \
            --optimized-fetch \
            --prune

          echo '=== VERIFY DIGITALIS ARM64 TREE ==='
          test -f build/envsetup.sh
          test -d build/soong
          test -d prebuilts/clang
          test -f frameworks/libs/binary_translation/Android.bp

          bt="$AOSP_TOP/frameworks/libs/binary_translation"
          test -f "$bt/enable_arm64_to_x86_64.mk"
          test -f "$bt/Android.bp"
          test -f "$bt/native_bridge/arm64/native_bridge.cc"
          test -f "$bt/decoder/arm64_test/decoder_test.cc"
          test -f "$bt/interpreter/arm64/interpreter-main.cc"
          test -f "$bt/lite_translator/arm64_to_x86_64/lite_translator.cc"
          test -f "$bt/code_gen_lib/arm64_to_x86_64/gen_wrapper.cc"

          echo '=== ENVSETUP ==='
          cd "$AOSP_TOP"
          source build/envsetup.sh

          echo '=== LUNCH ==='
          lunch "${TARGET_PRODUCT}-${TARGET_BUILD_VARIANT}"

          export SOONG_CONFIG_berberis_translation_arch=arm64_to_x86_64
          export NINJA_STATUS='[%f/%t %e] '

          echo '=== SINGLE BUILD ==='
          m -j4 \
            libberberis_arm64 \
            libberberis_decoder_arm64_unit_tests \
            libberberis_interpreter_arm64_unit_tests \
            libberberis_lite_translator_arm64_to_x86_64_unit_tests

          echo '=== VERIFY OUTPUT ==='
          out_dir="${OUT_DIR:-$AOSP_TOP/out}"
          so="$(find "$out_dir" -type f -name 'libberberis_arm64.so' -print -quit)"
          test -n "$so"
          file "$so"
          readelf -h "$so" | grep -q 'Machine:.*Advanced Micro Devices X86-64'
          ! nm -C "$so" 2>/dev/null | grep -Eiq 'riscv64|RISCV|RiscV'

          echo 'ARM64 native translation build: PASS'
          echo "Output: $so"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-build-log
          path: ${{ runner.temp }}/arm64-build.log
          if-no-files-found: warn