name: ARM64 Native Translation Build

on:
  push:
    branches:
      - arm64-native-translation
  pull_request:
    branches:
      - arm64-native-translation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-native-translation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      AOSP_TOP: ${{ github.workspace }}/.build/aosp
      DIGITALIS_MANIFEST: https://github.com/DigitalisX64/manifest.git
      DIGITALIS_REF: android-latest-release
      REPO_CACHE_KEY: digitalis-repo-Linux-android-latest-release-v23
      CCACHE_KEY: berberis-ccache-Linux-arm64-v23

    steps:
      - name: Checkout port configuration
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore Digitalis repo cache
        id: repo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}/.build/aosp/.repo/manifests
            ${{ github.workspace }}/.build/aosp/.repo/manifests.git
            ${{ github.workspace }}/.build/aosp/.repo/project-objects
            ${{ github.workspace }}/.build/aosp/.repo/repo
          key: ${{ env.REPO_CACHE_KEY }}
          restore-keys: |
            digitalis-repo-Linux-android-latest-release-v22
            digitalis-repo-Linux-android-latest-release-v21

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ${{ env.CCACHE_KEY }}
          restore-keys: |
            berberis-ccache-Linux-arm64-v22
            berberis-ccache-Linux-arm64-v21

      - name: Build ARM64 host translation
        id: build
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$RUNNER_TEMP/arm64-build.log") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "BUILD_FAILED rc=$rc line=$LINENO cmd=$BASH_COMMAND"; fi; exit "$rc"' EXIT
          set -x

          echo '=== BUILD START ==='
          date -u
          uname -a
          echo "CPU=$(nproc)"
          df -h /

          echo '=== INSTALL TOOLS ==='
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-lfs rsync python3 ccache
          git lfs install --skip-repo
          ccache --version

          echo '=== CONFIGURE GIT HTTPS ==='
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

          echo '=== INIT DIGITALIS TREE ==='
          mkdir -p "$AOSP_TOP" "$RUNNER_TEMP/bin" "$HOME/.cache/ccache"
          cd "$AOSP_TOP"

          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$RUNNER_TEMP/bin/repo"
          chmod +x "$RUNNER_TEMP/bin/repo"
          export PATH="$RUNNER_TEMP/bin:$PATH"

          repo init \
            -u "$DIGITALIS_MANIFEST" \
            -b "$DIGITALIS_REF" \
            --partial-clone \
            --clone-filter=blob:limit=5M \
            --no-use-superproject

          echo '=== SYNC DIGITALIS PRODUCT AND ARM64 TRANSLATION DEPENDENCIES ==='
          repo sync \
            -c \
            -j4 \
            --force-sync \
            --fail-fast \
            --no-tags \
            --no-clone-bundle \
            --optimized-fetch \
            --prune \
            build/make \
            build/blueprint \
            build/pesto \
            build/release \
            build/soong \
            art \
            bionic \
            device/common \
            device/generic/common \
            device/generic/goldfish \
            frameworks/av \
            frameworks/base \
            frameworks/native \
            frameworks/libs/native_bridge_support \
            hardware/interfaces \
            system/hardware/interfaces \
            kernel/configs \
            packages/modules/common \
            packages/modules/NeuralNetworks \
            packages/modules/Virtualization \
            packages/services/Car \
            system/apex \
            system/core \
            system/keymaster \
            system/libvintf \
            system/sepolicy \
            system/tools/aidl \
            system/tools/hidl \
            system/tools/xsdc \
            test/app_compat/csuite \
            frameworks/libs/binary_translation \
            external/golang-protobuf \
            external/go-cmp \
            external/mesa3d \
            external/pogreb \
            external/starlark-go \
            external/wpa_supplicant_8 \
            platform_testing \
            toolchain/pgo-profiles \
            prebuilts/build-tools \
            prebuilts/clang/host/linux-x86 \
            prebuilts/go/linux-x86 \
            digitalis

          echo 'SYNC_OK'

          echo '=== VERIFY SOURCE TREE ==='
          test -f build/envsetup.sh
          test -f build/soong/soong_ui.bash
          test -d build/release
          test -d device/generic/goldfish
          test -f device/generic/goldfish/64bitonly/product/sdk_phone64_x86_64_digitalis.mk
          test -d art
          test -d bionic
          test -d frameworks/av
          test -f frameworks/av/media/codec2/vndk/Android.bp
          test -d frameworks/base
          test -f frameworks/base/data/sounds/AllAudio.mk
          test -d frameworks/native
          test -f frameworks/native/libs/binder/tests/Android.bp
          test -d frameworks/libs/native_bridge_support
          test -f frameworks/libs/native_bridge_support/native_bridge_support.mk
          test -d hardware/interfaces
          test -f hardware/interfaces/power/aidl/Android.bp
          test -f hardware/interfaces/graphics/composer/aidl/Android.bp
          test -f hardware/interfaces/security/keymint/aidl/Android.bp
          test -d system/hardware/interfaces
          test -f system/hardware/interfaces/media/Android.bp
          test -d kernel/configs
          test -f kernel/configs/build/Android.bp
          test -d packages/modules/common
          test -d packages/modules/NeuralNetworks
          test -d packages/modules/Virtualization
          test -d packages/services/Car
          test -f packages/services/Car/cpp/vhal/client/Android.bp
          test -d platform_testing
          test -f platform_testing/libraries/rdroidtest/Android.bp
          test -d system/apex
          test -f system/apex/Android.bp
          test -d system/keymaster
          test -f system/keymaster/Android.bp
          test -d system/libvintf
          test -d system/sepolicy
          test -f system/sepolicy/build/soong/Android.bp
          test -d system/tools/hidl
          test -f system/tools/hidl/build/hidl_interface.go
          test -f system/tools/hidl/build/hidl_package_root.go
          test -d external/mesa3d
          test -d external/wpa_supplicant_8
          test -f external/wpa_supplicant_8/wpa_supplicant/Android.bp
          test -d system/core
          test -d system/tools/aidl
          test -f system/tools/aidl/build/aidl_interface.go
          test -d system/tools/xsdc
          test -f system/tools/xsdc/build/xsdc.go
          test -d test/app_compat/csuite
          test -f test/app_compat/csuite/tools/csuite_test/Android.bp
          test -f test/app_compat/csuite/tools/csuite_test/csuite_test.go
          test -d digitalis
          test -d toolchain/pgo-profiles
          test -f toolchain/pgo-profiles/sampling/afdo_profiles.mk
          test -f frameworks/libs/binary_translation/Android.bp
          test -f frameworks/libs/binary_translation/enable_arm64_to_x86_64.mk
          test -f frameworks/libs/binary_translation/native_bridge/arm64/native_bridge.cc
          test -f frameworks/libs/binary_translation/decoder/arm64_test/decoder_test.cc
          test -f frameworks/libs/binary_translation/interpreter/arm64/interpreter-main.cc
          test -f frameworks/libs/binary_translation/lite_translator/arm64_to_x86_64/lite_translator.cc
          test -f frameworks/libs/binary_translation/code_gen_lib/arm64_to_x86_64/gen_wrapper.cc
          test -d external/golang-protobuf/proto
          test -d external/go-cmp
          test -d external/pogreb
          test -d external/starlark-go/starlark

          echo '=== ENVSETUP ==='
          cd "$AOSP_TOP"
          set +u
          source build/envsetup.sh
          echo '=== DIGITALIS LUNCH ==='
          source digitalis/scripts/lunch-digitalis.sh
          set -u

          export SOONG_CONFIG_berberis_translation_arch=arm64_to_x86_64
          export NINJA_STATUS='[%f/%t %e] '
          export USE_CCACHE=1
          export CCACHE_DIR="$HOME/.cache/ccache"
          ccache -M 4G
          ccache -s
          ccache -z

          echo '=== SINGLE HOST BUILD ==='
          m -j2 libberberis_arm64

          echo '=== CCACHE STATS ==='
          ccache -s

          echo '=== VERIFY OUTPUT ==='
          out_dir="${OUT_DIR:-$AOSP_TOP/out}"
          so="$(find "$out_dir" -type f -name 'libberberis_arm64.so' -print -quit)"
          test -n "$so"
          file "$so"
          readelf -h "$so" | grep -q 'Machine:.*Advanced Micro Devices X86-64'
          ! nm -C "$so" 2>/dev/null | grep -Eiq 'riscv64|RISCV|RiscV'
          echo 'ARM64 native translation build: PASS'
          echo "Output: $so"

      - name: Save Digitalis repo cache
        if: always() && steps.repo-cache.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ github.workspace }}/.build/aosp/.repo/manifests
            ${{ github.workspace }}/.build/aosp/.repo/manifests.git
            ${{ github.workspace }}/.build/aosp/.repo/project-objects
            ${{ github.workspace }}/.build/aosp/.repo/repo
          key: ${{ env.REPO_CACHE_KEY }}

      - name: Save compiler cache
        if: always() && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ${{ env.CCACHE_KEY }}

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-build-logs
          path: ${{ runner.temp }}/arm64-build.log
          if-no-files-found: warn
