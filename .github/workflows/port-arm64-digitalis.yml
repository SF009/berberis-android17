name: ARM64 Native Translation Build

on:
  push:
    branches: [arm64-native-translation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      AOSP_TOP: ${{ runner.temp }}/aosp
      DIGITALIS_MANIFEST: https://github.com/DigitalisX64/manifest.git
      DIGITALIS_REF: android-latest-release
      DIGITALIS_BT_REF: 6f199667f039ff5f33c1d80fe52b59300ec1b663
      TARGET_PRODUCT: sdk_phone64_x86_64_digitalis-trunk_staging
      TARGET_BUILD_VARIANT: userdebug

    steps:
      - name: Checkout ARM64 native translation
        uses: actions/checkout@v4
        with:
          ref: arm64-native-translation
          fetch-depth: 1

      - name: Bootstrap partial Digitalis Android tree
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git-lfs rsync python3
          git lfs install --skip-repo

          rm -rf "$AOSP_TOP"
          mkdir -p "$AOSP_TOP"
          cd "$AOSP_TOP"

          if ! command -v repo >/dev/null 2>&1; then
            mkdir -p "$HOME/bin"
            curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
            chmod +x "$HOME/bin/repo"
            export PATH="$HOME/bin:$PATH"
          else
            export PATH="$(dirname "$(command -v repo)"):$PATH"
          fi

          repo init \
            -u "$DIGITALIS_MANIFEST" \
            -b "$DIGITALIS_REF" \
            --partial-clone \
            --clone-filter=blob:limit=10M \
            --no-use-superproject

          # The Berberis build needs Android's build/Soong infrastructure and
          # the platform libraries referenced by the ARM64 translator. Partial
          # clone keeps Git objects sparse; repo only materializes working trees
          # needed by the manifest checkout.
          repo sync -c -j"$(nproc)" \
            --no-tags \
            --no-clone-bundle \
            --force-sync

          test -f "$AOSP_TOP/build/envsetup.sh"
          test -d "$AOSP_TOP/build/soong"
          test -d "$AOSP_TOP/prebuilts/clang"

      - name: Overlay pinned ARM64 Berberis implementation
        shell: bash
        env:
          DIGITALIS_REPO: https://github.com/DigitalisX64/platform_frameworks_libs_binary_translation.git
        run: |
          set -euo pipefail

          cache="$RUNNER_TEMP/digitalis-bt"
          git clone --filter=blob:none --no-checkout "$DIGITALIS_REPO" "$cache"
          git -C "$cache" fetch --depth=1 origin "$DIGITALIS_BT_REF"
          git -C "$cache" checkout --detach --force "$DIGITALIS_BT_REF"

          python3 tools/materialize_arm64_build.py "$cache"

          dst="$AOSP_TOP/frameworks/libs/binary_translation"
          rm -rf "$dst"
          mkdir -p "$(dirname "$dst")"
          rsync -a --delete --exclude='.git/' "$cache/" "$dst/"

          for f in \
            "$dst/Android.bp" \
            "$dst/enable_arm64_to_x86_64.mk" \
            "$dst/berberis_config.mk" \
            "$dst/native_bridge/arm64/native_bridge.cc" \
            "$dst/decoder/arm64_test/decoder_test.cc" \
            "$dst/interpreter/arm64/interpreter-main.cc" \
            "$dst/lite_translator/arm64_to_x86_64/lite_translator.cc" \
            "$dst/code_gen_lib/arm64_to_x86_64/gen_wrapper.cc"; do
            test -e "$f"
          done

      - name: Build once
        shell: bash
        run: |
          set -euo pipefail
          cd "$AOSP_TOP"
          source build/envsetup.sh
          lunch "${TARGET_PRODUCT}-${TARGET_BUILD_VARIANT}"
          export SOONG_CONFIG_berberis_translation_arch=arm64_to_x86_64
          export NINJA_STATUS='[%f/%t %e] '

          # The only compiler/build invocation in this workflow.
          m -j"$(nproc)" \
            libberberis_arm64 \
            libberberis_decoder_arm64_unit_tests \
            libberberis_interpreter_arm64_unit_tests \
            libberberis_lite_translator_arm64_to_x86_64_unit_tests

          out_dir="${OUT_DIR:-$AOSP_TOP/out}"
          so="$(find "$out_dir" -type f -name 'libberberis_arm64.so' -print -quit)"
          test -n "$so"
          file "$so"
          readelf -h "$so" | grep -q 'Machine:.*Advanced Micro Devices X86-64'
          ! nm -C "$so" 2>/dev/null | grep -Eiq 'riscv64|RISCV|RiscV'
          echo "ARM64 native translation build: PASS"
          echo "Output: $so"
