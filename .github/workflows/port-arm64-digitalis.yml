name: ARM64 Native Translation Build

on:
  push:
    branches: [arm64-native-translation]
  pull_request:
    branches: [arm64-native-translation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-native-translation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      AOSP_TOP: ${{ github.workspace }}/.build/aosp
      DIGITALIS_MANIFEST: https://github.com/DigitalisX64/manifest.git
      DIGITALIS_REF: android-latest-release
      CCACHE_KEY: berberis-ccache-Linux-arm64-v37
      REPO_JOBS: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ${{ env.CCACHE_KEY }}
          restore-keys: |
            berberis-ccache-Linux-arm64-v36
            berberis-ccache-Linux-arm64-v35
            berberis-ccache-Linux-arm64-v34

      - name: Prepare repo
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$AOSP_TOP" "$RUNNER_TEMP/bin"
          cd "$AOSP_TOP"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$RUNNER_TEMP/bin/repo"
          chmod +x "$RUNNER_TEMP/bin/repo"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

          repo init \
            -u "$DIGITALIS_MANIFEST" \
            -b "$DIGITALIS_REF" \
            --partial-clone \
            --clone-filter=blob:limit=5M \
            --no-use-superproject

      - name: Measure PDK manifest and Git metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$AOSP_TOP"

          echo '=== FULL MANIFEST ==='
          repo manifest -r -o "$RUNNER_TEMP/full-manifest.xml"

          echo '=== FILTER PDK PROJECTS ==='
          python3 - "$RUNNER_TEMP/full-manifest.xml" "$RUNNER_TEMP/pdk-manifest.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          src, dst = sys.argv[1], sys.argv[2]
          root = ET.parse(src).getroot()

          def has_pdk_group(project):
              groups = set()
              raw = project.get("groups", "")
              groups.update(x.strip() for x in raw.split(",") if x.strip())
              return "pdk" in groups

          out = ET.Element("manifest")
          for key, value in root.attrib.items():
              out.set(key, value)

          for child in root:
              if child.tag == "project" and has_pdk_group(child):
                  out.append(child)

          ET.ElementTree(out).write(dst, encoding="utf-8", xml_declaration=True)
          PY

          PROJECT_COUNT="$(grep -c '<project ' "$RUNNER_TEMP/pdk-manifest.xml" || true)"
          echo "PDK project count: $PROJECT_COUNT"

          echo '=== PDK MANIFEST SIZE ==='
          wc -c "$RUNNER_TEMP/pdk-manifest.xml"

          echo '=== PDK PROJECT PATHS ==='
          grep '<project ' "$RUNNER_TEMP/pdk-manifest.xml" \
            | sed -E 's/.*path="([^"]+)".*/\1/' \
            | sort

          echo '=== METADATA-ONLY FETCH ==='
          repo sync \
            -g pdk \
            -n \
            -c -j"${REPO_JOBS}" \
            --no-tags \
            --no-clone-bundle \
            --optimized-fetch \
            --prune

          echo '=== METADATA DISK USAGE ==='
          du -sh .repo

          echo '=== DISK AFTER METADATA FETCH ==='
          df -h /

      - name: Sync PDK source
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$AOSP_TOP"

          repo sync \
            -g pdk \
            -c -j"$REPO_JOBS" \
            --force-sync \
            --fail-fast \
            --no-tags \
            --no-clone-bundle \
            --optimized-fetch \
            --prune

      - name: Verify build environment
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$AOSP_TOP"

          test -f build/envsetup.sh
          test -f build/make/core/envsetup.mk
          test -f build/soong/soong_ui.bash
          test -f build/soong/root.bp
          test -f build/soong/go.mod
          test -f bionic/Android.bp
          test -f frameworks/libs/binary_translation/Android.bp
          test -f heavy_optimizer/arm64/Android.bp

      - name: Inject ARM64 port
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf "$AOSP_TOP/heavy_optimizer/arm64"
          mkdir -p "$AOSP_TOP/heavy_optimizer"
          cp -a "$GITHUB_WORKSPACE/heavy_optimizer/arm64" \
                "$AOSP_TOP/heavy_optimizer/arm64"

          if grep -q 'libberberis_heavy_optimizer_arm64' "$GITHUB_WORKSPACE/Android.bp"; then
            cat "$GITHUB_WORKSPACE/Android.bp" >> "$AOSP_TOP/Android.bp"
          fi

      - name: Build ARM64 native translation
        id: build
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$RUNNER_TEMP/arm64-build.log") 2>&1
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "BUILD_FAILED rc=$rc cmd=$BASH_COMMAND"; fi; exit "$rc"' EXIT

          cd "$AOSP_TOP"

          export SOONG_CONFIG_berberis_translation_arch=arm64_to_x86_64
          export TARGET_ARCH=x86_64
          export TARGET_2ND_ARCH=
          export OUT_DIR="$AOSP_TOP/out"
          export USE_CCACHE=1
          export CCACHE_DIR="$HOME/.cache/ccache"

          ccache -M 4G
          ccache -z

          build/soong/soong_ui.bash --make-mode -j2 \
            libberberis_arm64 \
            libberberis_heavy_optimizer_arm64 \
            libberberis_heavy_optimizer_arm64_unit_tests

          echo '=== VERIFY OUTPUT ==='
          so="$(find "$OUT_DIR" -type f -name 'libberberis_arm64.so' -print -quit)"
          test -n "$so"
          file "$so"
          readelf -h "$so" | grep -q 'Machine:.*X86-64'
          echo 'ARM64 native translation build: PASS'
          echo "Output: $so"

          echo '=== CCACHE ==='
          ccache -s

      - name: Save ccache
        if: always() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ${{ env.CCACHE_KEY }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-build-logs
          path: ${{ runner.temp }}/arm64-build.log
          if-no-files-found: warn

      - name: Upload binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: berberis-arm64-x86_64
          path: |
            .build/aosp/out/**/libberberis_arm64.so
            .build/aosp/out/**/libberberis_heavy_optimizer_arm64*
          if-no-files-found: error
